# Estudio "ritmo de adaptación de la gramática, re-mapeo y estabilidad en PSGE" (plan del 2026-11-08).
# CONGELADO el 2026-11-08 tras el piloto (meta/remap_pilot_20261108-204010, commit 85628b5) y el
# prerregistro del análisis (examples/analyze_remap_study.py). No modificar sin documentarlo como
# desviación en CHANGELOG_REMAP_STUDY.md. La confirmación solo se lanza con FROZEN: true.
# Fichero de parámetros completo: se pasa tal cual como parameters_file al motor.
FROZEN: true

# --- Presupuesto y operadores: los del estudio anterior (gecco_frozen.yml), comunes a las 11 condiciones ---
POPSIZE: 500
GENERATIONS: 100
ELITISM: 5                      # 1 % de la población
PROB_CROSSOVER: 0.9
PROB_MUTATION: 0.05
TSIZE: 3
MIN_TREE_DEPTH: 12
MAX_TREE_DEPTH: 12
REMAP: True                     # las élites se re-evalúan con la PCFG vigente (como antes)
INCLUDE_GENOTYPE: False
VERBOSE: False

# --- PSGE ---
N_BEST: 1
ADAPTIVE_LF: False
LEARNING_FACTOR: 0.01           # valor por defecto; cada condición fija el suyo (REMAP_LAMBDAS)

# --- Factor manipulado (RQ-A): rejilla logarítmica de lambda, confirmada por el piloto ---
REMAP_LAMBDAS: [0.005, 0.01, 0.02, 0.05, 0.1]

# --- Instrumentación: trayectoria compacta dentro del JSON y sin volcados pesados por generación ---
TRACK_TRAJECTORY: True
REMAP_RATE_SAMPLE: 100          # tasa de re-mapeo sobre 100 individuos a rangos equiespaciados de la
                                # población ordenada (sin azar): ~0,1 s por generación en vez de ~0,6 s
DUMP_GRAMMAR: False
DUMP_POPULATION: False
DUMP_PROGRESS: False
SAVE_STEP: 1000000
